name: syntax
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Type-check the QNX sources without an SDK
        run: ./tools/check-syntax.sh
